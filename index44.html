<!DOCTYPE html>
<html>
<head>
    <title>Simple Shopping Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .products {
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }

        .product {
            background-color: white;
            width: 200px;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }

        .product img {
            width: 100%;
            height: 150px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            margin-top: 10px;
            padding: 8px;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

<header>
    <h1>My Simple Shop</h1>
    <p>Buy what you love</p>
</header>

<div class="products">

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product">
        <h3>Product 1</h3>
        <p class="price">₹499</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product">
        <h3>Product 2</h3>
        <p class="price">₹799</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product">
        <h3>Product 3</h3>
        <p class="price">₹299</p>
        <button>Add to Cart</button>
    </div>

</div>

<footer>
    <p>© 2026 My Simple Shop</p>
</footer>

</body>
</html>
