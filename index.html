<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factorial Calculator</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Factorial Calculator</h1>
      <p>Enter a non-negative whole number to calculate its factorial.</p>

      <div class="input-group">
        <label for="numberInput">Number</label>
        <input type="number" id="numberInput" min="0" step="1" placeholder="Enter a number">
      </div>

      <button id="calculateBtn" type="button">Calculate</button>
      <p id="result" class="result">Result will appear here.</p>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
